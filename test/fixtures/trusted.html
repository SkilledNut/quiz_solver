<!doctype html>
<html><head><meta charset="utf-8"><title>Trusted-clicks-only quiz</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 20px; }
  .q { border: 1px solid #ccc; padding: 10px; margin: 12px 0; }
  .fancy input { position: absolute; opacity: 0; width: 0; height: 0; }
  .fancy label { display: block; padding: 6px; border: 1px solid #ddd; margin: 3px 0; cursor: pointer; }
  [role=radio] { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-radius: 50%; vertical-align: middle; cursor: pointer; }
  [role=radio][aria-checked=true] { background: #2563eb; }
  iframe { width: 420px; height: 170px; border: 2px solid #999; margin-left: 40px; }
</style></head>
<body>
<p id="log">untrusted events rejected: <span id="rej">0</span> · trusted changes: <span id="tc">0</span></p>

<div class="q">
  <p>1. Which are primary colours (RGB)?</p>
  <label><input type="checkbox" class="t"> Red</label><br>
  <label><input type="checkbox" class="t"> Purple</label><br>
  <label><input type="checkbox" class="t"> Blue</label>
</div>

<div class="q fancy">
  <p>2. Largest planet?</p>
  <label><input type="radio" name="p" class="t"><span>Mars</span></label>
  <label><input type="radio" name="p" class="t"><span>Jupiter</span></label>
  <label><input type="radio" name="p" class="t"><span>Venus</span></label>
</div>

<div class="q" style="margin-top:1600px">
  <div role="heading">3. Water freezes at 0 °C.</div>
  <div role="radiogroup">
    <div><span role="radio" aria-checked="false" aria-label="True"></span> True</div>
    <div><span role="radio" aria-checked="false" aria-label="False"></span> False</div>
  </div>
</div>

<iframe id="xf" title="embedded question"></iframe>

<script>
  // Behaves like anti-automation code: scripted (isTrusted=false) clicks are ignored.
  const rej = () => { const r = document.getElementById('rej'); r.textContent = +r.textContent + 1; };
  const tc = () => { const r = document.getElementById('tc'); r.textContent = +r.textContent + 1; };
  document.addEventListener('change', (e) => { if (e.isTrusted) tc(); }, true);
  document.addEventListener('click', (e) => { if (e.isTrusted && e.target.closest('[role=radio]')) tc(); }, true);
  document.addEventListener('click', (e) => {
    if (e.target.matches('input.t') && !e.isTrusted) { e.preventDefault(); rej(); }
  }, true);
  document.addEventListener('click', (e) => {
    const r = e.target.closest('[role=radio]');
    if (!r) return;
    if (!e.isTrusted) { rej(); return; }
    r.closest('[role=radiogroup]').querySelectorAll('[role=radio]').forEach((x) => x.setAttribute('aria-checked', 'false'));
    r.setAttribute('aria-checked', 'true');
  });
  // cross-origin iframe: same server, other hostname
  const other = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
  document.getElementById('xf').src = `${location.protocol}//${other}:${location.port}/test/fixtures/trusted-frame.html`;
</script>
</body></html>
